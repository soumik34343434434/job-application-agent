name: Temporary Naukri Password Auth Test

on:
  push:
    branches:
      - test/naukri-password-auth

permissions:
  contents: read

jobs:
  auth-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore encrypted Naukri state
        env:
          NAUKRI_STATE_KEY: ${{ secrets.NAUKRI_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${NAUKRI_STATE_KEY}"
          test -f runtime/naukri.storage-state.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:NAUKRI_STATE_KEY \
            -in runtime/naukri.storage-state.enc \
            -out /tmp/naukri.storage-state.json

      - name: Inspect live Naukri login DOM
        env:
          PYTHONPATH: .
          NAUKRI_STORAGE_STATE_PATH: /tmp/naukri.storage-state.json
        run: |
          python - <<'PY'
          from src.naukri import NaukriAgent
          with NaukriAgent(headless=True, slow_mo=0) as agent:
              agent.page.goto("https://www.naukri.com/nlogin/login", wait_until="domcontentloaded", timeout=20000)
              agent.page.wait_for_timeout(2500)
              print("LOGIN_URL=", agent.page.url)
              print("LOGIN_TITLE=", agent.page.title())
              print("INPUTS=", agent.page.locator("input").count())
              for i in range(min(agent.page.locator("input").count(), 20)):
                  el=agent.page.locator("input").nth(i)
                  print("INPUT", i, el.evaluate("(e)=>e.outerHTML"))
              print("BUTTONS=", agent.page.locator("button").count())
              for i in range(min(agent.page.locator("button").count(), 20)):
                  el=agent.page.locator("button").nth(i)
                  print("BUTTON", i, el.evaluate("(e)=>e.outerHTML"))
          PY

      - name: Verify Naukri authentication
        env:
          PYTHONPATH: .
          NAUKRI_STORAGE_STATE_PATH: /tmp/naukri.storage-state.json
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
        run: |
          python - <<'PY'
          from src.naukri import NaukriAgent
          with NaukriAgent(headless=True, slow_mo=0) as agent:
              agent.ensure_logged_in(interactive=False)
              print("NAUKRI_PASSWORD_AUTH=PASS")
          PY

      - name: Remove temporary plaintext state
        if: always()
        run: rm -f /tmp/naukri.storage-state.json
