name: Temporary Naukri Login Entry Test

on:
  push:
    branches:
      - test/naukri-login-entry

permissions:
  contents: read

jobs:
  login-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test homepage then Login
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import re, json

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("https://www.naukri.com/", wait_until="domcontentloaded", timeout=30000)
              page.wait_for_timeout(3000)
              print("HOME_URL=", page.url)
              print("HOME_TITLE=", page.title())
              print("HOME_BODY=", page.locator("body").inner_text()[:1200].replace("\n"," | "))

              login_candidates = [
                  page.get_by_role("link", name=re.compile(r"^(login|sign in|log in)$", re.I)),
                  page.get_by_role("button", name=re.compile(r"^(login|sign in|log in)$", re.I)),
                  page.get_by_text(re.compile(r"^(login|sign in|log in)$", re.I)),
              ]
              clicked=False
              for loc in login_candidates:
                  try:
                      if loc.count():
                          print("LOGIN_CANDIDATE_COUNT=", loc.count())
                          loc.first.click()
                          clicked=True
                          break
                  except Exception as exc:
                      print("LOGIN_CLICK_ERROR=", type(exc).__name__, str(exc)[:300])

              print("LOGIN_CLICKED=", clicked)
              if clicked:
                  page.wait_for_timeout(2500)
              print("AFTER_LOGIN_URL=", page.url)
              print("AFTER_LOGIN_TITLE=", page.title())
              print("AFTER_LOGIN_INPUTS=", page.locator("input").count())
              print("AFTER_LOGIN_BODY=", page.locator("body").inner_text()[:1600].replace("\n"," | "))

              page2=page.context.new_page()
              page2.goto("https://www.naukri.com/nlogin/login", wait_until="domcontentloaded", timeout=30000)
              page2.wait_for_timeout(2500)
              print("DIRECT_URL=", page2.url)
              print("DIRECT_TITLE=", page2.title())
              print("DIRECT_INPUTS=", page2.locator("input").count())
              print("DIRECT_BODY=", page2.locator("body").inner_text()[:1200].replace("\n"," | "))

              browser.close()
          PY
