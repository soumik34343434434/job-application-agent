name: Naukri Headed Browser Compatibility Probe

on:
  push:
    branches:
      - diag/naukri-edge-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Headed Chromium probe under Xvfb
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium >/dev/null 2>&1
          xvfb-run -a python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(headless=False)
              page=b.new_page(user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36")
              try:
                  r=page.goto("https://www.naukri.com/", wait_until="domcontentloaded", timeout=20000)
                  print("STATUS=", r.status if r else None)
                  print("TITLE=", page.title())
                  print("URL=", page.url)
                  print("BODY=", page.locator("body").inner_text(timeout=5000)[:600].replace("\n"," "))
              except Exception as e:
                  print("ERROR=",repr(e))
              b.close()
          PY
