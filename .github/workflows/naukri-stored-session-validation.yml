name: Naukri Stored Session Validation

on:
  push:
    branches:
      - fix/naukri-ci-headed-browser

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Restore encrypted session
        env:
          NAUKRI_STATE_KEY: ${{ secrets.NAUKRI_STATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$NAUKRI_STATE_KEY"
          mkdir -p runtime
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:NAUKRI_STATE_KEY -in runtime/naukri.storage-state.enc -out runtime/naukri.storage-state.json

      - name: Validate stored session with headed Chromium
        env:
          PYTHONPATH: .
          NAUKRI_STORAGE_STATE_PATH: ${{ github.workspace }}/runtime/naukri.storage-state.json
          TZ: Asia/Kolkata
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/naukri-xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 1
          python - <<'PY'
          from src.naukri import NaukriAgent
          with NaukriAgent(headless=False, slow_mo=0) as agent:
              ok = agent.is_logged_in()
              print(f"STORED_SESSION_AUTHENTICATED={ok}")
              if not ok:
                  raise SystemExit(2)
          PY

      - name: Remove plaintext state
        if: always()
        run: rm -f runtime/naukri.storage-state.json
