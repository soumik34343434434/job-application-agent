name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q -m "not live and not naukri_live"


  live_naukri_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install "playwright>=1.60,<2" pytest
          python -m playwright install --with-deps chromium
      - name: Public Naukri smoke probe
        env:
          PYTHONPATH: .
        run: pytest -q -m live -s tests/test_live_naukri.py
      - name: Upload live probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-live-probe
          path: outbox/live_probe/
          if-no-files-found: ignore


  naukri_live_local:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python
        run: |
          test -x /Users/sante/Downloads/job_application_agent/.venv/bin/python
          /Users/sante/Downloads/job_application_agent/.venv/bin/python --version
          /Users/sante/Downloads/job_application_agent/.venv/bin/python -m pip --version
      - name: Install dependencies
        run: |
          /Users/sante/Downloads/job_application_agent/.venv/bin/python -m pip install -r requirements.txt pytest
      - name: Authenticated Naukri live regression
        env:
          PYTHONPATH: .
          NAUKRI_CDP_PORT: "9229"
        run: |
          /Users/sante/Downloads/job_application_agent/.venv/bin/python -m pytest -q -m naukri_live tests/test_naukri_live_local.py -s
      - name: Upload Naukri live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-live-runner-diagnostics
          path: outbox/live_runner/
          if-no-files-found: ignore
