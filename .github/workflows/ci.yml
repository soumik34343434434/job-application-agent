name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        env:
          PYTHONPATH: .
        run: pytest -q -m "not live and not naukri_live"


  live_naukri_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install "playwright>=1.60,<2" pytest
          python -m playwright install --with-deps chromium
      - name: Public Naukri smoke probe
        env:
          PYTHONPATH: .
        run: pytest -q -m live -s tests/test_live_naukri.py
      - name: Upload live probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-live-probe
          path: outbox/live_probe/
          if-no-files-found: ignore


  naukri_live_local:
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native ARM64 Python
        run: |
          set -e
          for candidate in /opt/homebrew/bin/python3 /usr/local/bin/python3 /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.11; do
            if [ -x "$candidate" ]; then
              arch -arm64 "$candidate" --version 2>/dev/null || true
              if arch -arm64 "$candidate" -c 'import sys; print(sys.version_info >= (3, 10))' 2>/dev/null | grep -q True; then
                echo "CI_PYTHON=$candidate" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
          done
          echo "No native ARM64 Python >=3.10 found." >&2
          echo "PATH: $PATH" >&2
          command -v python3 || true
          file "$(command -v python3)" || true
          exit 1
      - name: Install dependencies
        run: |
          arch -arm64 "$CI_PYTHON" -m venv .ci-venv
          arch -arm64 .ci-venv/bin/python --version
          arch -arm64 .ci-venv/bin/python -m pip install --upgrade pip
          arch -arm64 .ci-venv/bin/python -m pip install -r requirements.txt pytest
      - name: Authenticated Naukri live regression
        env:
          PYTHONPATH: .
          NAUKRI_CDP_PORT: "9229"
        run: |
          arch -arm64 .ci-venv/bin/python -m pytest -q -m naukri_live tests/test_naukri_live_local.py -s
      - name: Upload Naukri live diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-live-runner-diagnostics
          path: outbox/live_runner/
          if-no-files-found: ignore
