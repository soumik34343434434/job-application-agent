name: Naukri Password Auth Validation

on:
  push:
    branches:
      - fix/naukri-ci-headed-browser

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Start virtual display
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac >/tmp/naukri-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1

      - name: Test fresh Naukri authentication only
        env:
          PYTHONPATH: .
          NAUKRI_EMAIL: ${{ secrets.NAUKRI_EMAIL }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          NAUKRI_HEADLESS: "false"
          TZ: Asia/Kolkata
        run: |
          set -euo pipefail
          test -n "$NAUKRI_EMAIL"
          test -n "$NAUKRI_PASSWORD"
          python - <<'PY'
          from src.naukri import NaukriAgent
          with NaukriAgent(headless=False, slow_mo=0) as agent:
              agent.ensure_logged_in(interactive=False)
              print("AUTH_RESULT=AUTHENTICATED")
          PY
